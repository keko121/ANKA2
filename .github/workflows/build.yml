# =============================================================================
# ANKA2 Projesi - CI/CD Build Workflow
# =============================================================================
# Bu workflow her push ve PR'da otomatik çalışır
# - Ubuntu: Server (game + db) derlemesi
# - Windows: Client derlemesi
# =============================================================================

name: Build

on:
  push:
    branches: [ main, develop, clean-master ]
  pull_request:
    branches: [ main, develop, clean-master ]

env:
  BUILD_TYPE: Release

jobs:
  # ===========================================================================
  # SERVER BUILD (Ubuntu/Linux)
  # ===========================================================================
  build-server-linux:
    name: 🐧 Server (Ubuntu)
    runs-on: ubuntu-22.04
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        lfs: false

    - name: 📦 Install Dependencies
      run: |
        chmod +x ./scripts/install-deps-ubuntu.sh
        sudo ./scripts/install-deps-ubuntu.sh

    - name: 🔨 Build liblua
      working-directory: Source/Server/library/liblua
      run: |
        make clean || true
        make -j$(nproc)

    - name: 🔨 Build libthecore
      working-directory: Source/Server/library/libthecore/src
      run: |
        make clean || true
        rm -f Depend
        touch Depend
        make dep || true
        make -j$(nproc)

    - name: 🔨 Build libsql
      working-directory: Source/Server/library/libsql
      run: |
        make clean || true
        rm -f Depend
        touch Depend
        make dep || true
        make -j$(nproc)

    - name: 🔨 Build libgame
      working-directory: Source/Server/library/libgame/src
      run: |
        make clean || true
        rm -f Depend
        touch Depend
        make dep || true
        make -j$(nproc)

    - name: 🔨 Build libpoly
      working-directory: Source/Server/library/libpoly
      run: |
        make clean || true
        rm -f Depend
        touch Depend
        make dep || true
        make -j$(nproc)

    - name: 🔨 Build DB Server
      working-directory: Source/Server/db/src
      run: |
        make clean || true
        rm -f Depend
        touch Depend
        make dep || true
        make -j$(nproc)

    - name: 🔨 Build Game Server
      working-directory: Source/Server/game/src
      run: |
        make clean || true
        rm -f Depend
        touch Depend
        make dep || true
        make -j$(nproc)

    - name: 🧪 Run Smoke Tests
      run: |
        chmod +x ./scripts/smoke-test.sh
        ./scripts/smoke-test.sh || echo "Smoke tests completed with warnings"

    - name: 🔍 Static Analysis (cppcheck)
      run: |
        sudo apt-get install -y cppcheck
        cppcheck --enable=warning,style --error-exitcode=0 \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          -I Source/Server/library/libthecore/include \
          -I Source/Server/library/libsql \
          -I Source/Server/library/libgame/src \
          Source/Server/game/src/*.cpp \
          Source/Server/db/src/*.cpp \
          2>&1 | head -100 || true

    - name: 📤 Upload Server Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: server-linux-${{ github.sha }}
        path: |
          Source/Server/game
          Source/Server/db
        retention-days: 30

  # ===========================================================================
