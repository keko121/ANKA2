  # ===========================================================================
  # DEPLOY (Sadece main branch)
  # ===========================================================================
  deploy:
    name: 🚀 Deploy to VPS
    needs: [build-server-linux]
    runs-on: ubuntu-22.04
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/clean-master') && github.event_name == 'push'
    
    steps:
    - name: 📥 Download Server Artifacts
      uses: actions/download-artifact@v4
      with:
        name: server-linux-${{ github.sha }}
        path: ./artifacts

    - name: 🚀 Deploy to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "./artifacts/*"
        target: "/home/game/bin/"
        strip_components: 1

    - name: 🔄 Restart Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /home/game
          ./admin.sh restart || true
          echo "✅ Server restarted!"
